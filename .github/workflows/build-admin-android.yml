name: Build Android APK DFL Admin

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: "APK a compilar (automatico no push)"
        type: choice
        required: true
        default: ambos
        options: [ambos, admin, cliente, automatico]

permissions:
  contents: read

jobs:
  scope:
    name: Selecionar APKs pelo diff
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.select.outputs.admin }}
      cliente: ${{ steps.select.outputs.cliente }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: select
        name: Classificar alteracoes sem rebuild desnecessario
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_MODE: ${{ inputs.apps }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/select-android-builds.cjs

  build:
    needs: scope
    if: needs.scope.outputs.admin == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Instalar dependências web
        run: npm ci

      - name: Validar contratos Admin
        shell: bash
        run: |
          node scripts/test-site-r56-updates.cjs
          node scripts/test-site-r57-native-updater.cjs
          node scripts/test-site-r58-premium.cjs
          node scripts/test-admin-runtime-v19.mjs
          node scripts/test-admin-web-push-v20.mjs
          node scripts/test-admin-android-v21.mjs
          node scripts/test-admin-instant-actions-v21-1.mjs
          node scripts/test-pre-apk-site-fixes-v21-2.mjs
          node scripts/test-admin-alarm-v21-3.mjs
          node scripts/test-admin-safe-launcher-v21-4.mjs
          node scripts/test-admin-resilient-launcher-v21-5.mjs
          node scripts/test-admin-buildconfig-v21-5-1.mjs
          node scripts/test-admin-manage-data-v21-5-2.mjs
          node scripts/test-admin-clean-launch-intent-v21-5-3.mjs
          node scripts/test-admin-new-task-v21-5-4.mjs
          node scripts/test-admin-production-polish-v22.mjs
          node scripts/test-admin-scheduling-v23.mjs
          node scripts/test-admin-operational-experience-v24.mjs
          node scripts/test-admin-entregas-bridge-v25.mjs
          node scripts/test-admin-release-v26.mjs
          node scripts/test-admin-final-experience-v27.mjs
          node scripts/test-admin-production-runtime-v28.mjs
          node scripts/test-admin-release-v28.mjs
          node scripts/test-admin-native-push-bridge-v29.mjs
          node scripts/test-delivery-completion-catchup-v30.mjs
          node scripts/test-admin-control-center-v31.mjs
          node scripts/test-admin-inspector-v32.mjs
          node scripts/test-lucide-standard-v32-2.mjs
          node scripts/test-admin-hook-order-v34-1-r5.mjs
          node scripts/test-admin-foundation-v35.mjs
          node scripts/test-admin-modules-v36.mjs
          node scripts/test-admin-post-macro-release-v36-1.mjs
          node scripts/test-admin-operational-cockpit-v37-r3.mjs
          node scripts/test-admin-final-responsive-polish-v37-1-r2.mjs
          node scripts/test-admin-density-delivery-v38.mjs
          node scripts/test-catalog-v47.mjs
          node scripts/test-catalog-v48.mjs
          node scripts/test-catalog-v49.mjs
          node scripts/test-mobile-viewport-v50.mjs
          node scripts/test-smartcart-v2.mjs
          node scripts/test-site-sales-critical-r1.cjs
          node scripts/test-site-sales-operation-r2.cjs
          node scripts/test-site-sales-recovery-r3.cjs
          node scripts/test-roadmap-final-v2.mjs
          node scripts/release-gate-catalog-v43.mjs
          node scripts/test-visual-campaign-r103.cjs
          node scripts/test-visual-campaign-r104.cjs
          node scripts/test-site-r105-closing.cjs
          node scripts/test-site-r106-pwa-polish.cjs
          node scripts/test-site-r107-scroll-lock.cjs
          node scripts/test-site-r228-relay-separation.cjs
          node scripts/test-site-r228-checkout-compat.cjs
          node scripts/test-site-r229-alarm-client.cjs
          node scripts/test-site-r230-client-icon.cjs
          node scripts/test-android-release-gate-v50-1.mjs
          node scripts/test-site-r102-preopening.cjs
          node node_modules/typescript/bin/tsc --noEmit
          git diff --check

      - name: Gerar assets Android do Master
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 scripts/generate-admin-android-assets.py
          test -s android-admin/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          test -s android-admin/app/src/main/res/drawable-nodpi/ic_stat_dfl_admin.png
          test -s android-admin/app/src/main/res/drawable-nodpi/splash.png
          test -s android-admin/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Restaurar assinatura Android estável
        shell: bash
        env:
          DFL_ADMIN_KEYSTORE_BASE64: ${{ secrets.DFL_ADMIN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DFL_ADMIN_KEYSTORE_BASE64" || {
            echo "ERRO: secret DFL_ADMIN_KEYSTORE_BASE64 ausente."
            exit 1
          }

          KEYSTORE="$RUNNER_TEMP/dfl-admin.keystore"
          printf '%s' "$DFL_ADMIN_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list -v \
            -keystore "$KEYSTORE" \
            -alias dfladmin \
            -storepass android \
            -keypass android >/dev/null

          SHA256="$(keytool -list -v \
            -keystore "$KEYSTORE" \
            -alias dfladmin \
            -storepass android \
            -keypass android \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n1)"

          EXPECTED="77:F6:88:B5:32:06:0E:41:35:C2:9F:4E:24:22:4A:6C:34:C0:F1:74:DB:D2:65:E4:BD:27:50:6D:88:17:55:63"

          test "$SHA256" = "$EXPECTED" || {
            echo "ERRO: keystore não corresponde ao Digital Asset Links."
            echo "Esperado: $EXPECTED"
            echo "Recebido: $SHA256"
            exit 1
          }

          echo "DFL_ADMIN_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK release
        shell: bash
        run: |
          gradle -p android-admin clean assembleRelease

      - name: Validar assinatura do APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android-admin/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n1)"
          test -n "$APKSIGNER"

          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$CERTS"

          ACTUAL="$(printf '%s\n' "$CERTS" \
            | sed -nE '/[Ss][Hh][Aa]-256[[:space:]]+[Dd][Ii][Gg][Ee][Ss][Tt]:/ { s/^.*:[[:space:]]*//; p; q; }' \
            | tr -d '[:space:]' \
            | tr '[:lower:]' '[:upper:]')"

          EXPECTED="77F688B532060E4135C29F4E24224A6C34C0F174DBD265E4BD27506D88175563"

          test "$ACTUAL" = "$EXPECTED" || {
            echo "ERRO: assinatura real do APK diverge da assinatura oficial."
            exit 1
          }

          echo "ASSINATURA DFL ADMIN VALIDADA."

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DFL-Admin-${{ github.run_number }}-${{ github.sha }}
          path: android-admin/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  cliente:
    name: DFL Cliente Android release
    needs: scope
    if: needs.scope.outputs.cliente == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - name: Validar isolamento do APK Cliente
        run: |
          npm ci
          node scripts/test-site-r229-alarm-client.cjs
          node scripts/test-site-r230-client-icon.cjs
          node scripts/test-site-r56-updates.cjs
          node scripts/test-site-r57-native-updater.cjs
          node scripts/test-site-r58-premium.cjs
          node scripts/test-site-sales-r5-ui-recovery.cjs
          node scripts/test-site-r228-checkout-compat.cjs
      - name: Gerar APK cliente a partir do launcher estavel
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 scripts/prepare-client-android.py
          python3 scripts/verify-client-android-icons.py
          test -s android-cliente/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android-cliente/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          test -s android-cliente/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          test -s android-cliente/app/src/main/res/drawable-nodpi/ic_stat_dfl_cliente.png
      - name: Assinatura estavel da familia Android
        env:
          DFL_ADMIN_KEYSTORE_BASE64: ${{ secrets.DFL_ADMIN_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DFL_ADMIN_KEYSTORE_BASE64" || { echo 'Secret de assinatura ausente'; exit 1; }
          KEYSTORE="$RUNNER_TEMP/dfl-cliente.keystore"
          printf '%s' "$DFL_ADMIN_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          SHA256="$(keytool -list -v -keystore "$KEYSTORE" -alias dfladmin -storepass android -keypass android | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)"
          test "$SHA256" = '77:F6:88:B5:32:06:0E:41:35:C2:9F:4E:24:22:4A:6C:34:C0:F1:74:DB:D2:65:E4:BD:27:50:6D:88:17:55:63'
          echo "DFL_ADMIN_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compilar APK Cliente
        run: gradle -p android-cliente clean assembleRelease
      - name: Validar pacote e assinatura final
        shell: bash
        run: |
          set -euo pipefail
          APK=android-cliente/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n1)"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n1)"
          test -n "$AAPT" && test -n "$APKSIGNER"
          "$AAPT" dump badging "$APK" | grep -Fq "package: name='br.com.dafamilialanches.cliente'"
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/client-cert.txt"
          grep -iEq '77f688b532060e4135c29f4e24224a6c34c0f174dbd265e4bd27506d88175563' "$RUNNER_TEMP/client-cert.txt"
          echo 'CLIENTE: ID E CERTIFICADO CONFERIDOS'
      - uses: actions/upload-artifact@v4
        with:
          name: DFL-Cliente-${{ github.run_number }}-${{ github.sha }}
          path: android-cliente/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7


  release-admin-certified:
    name: Release Admin (somente com aprovacao explicita)
    needs: [scope, build]
    if: ${{ needs.scope.outputs.admin == 'true' && needs.build.result == 'success' && vars.DFL_ANDROID_RELEASES_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DFL-Admin-${{ github.run_number }}-${{ github.sha }}
          path: dist
      - name: Revalidar APK, pacote e assinatura antes de Release
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/app-release.apk"
          test -s "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n1)"
          SIGNER="$(find "$SDK/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n1)"
          test -n "$AAPT" && test -n "$SIGNER"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -Fq "name='br.com.dafamilialanches.admin'" <<< "$BADGING"
          grep -Fq "versionCode='${GITHUB_RUN_NUMBER}'" <<< "$BADGING"
          CERT="$("$SIGNER" verify --print-certs "$APK")"
          grep -iEq '77f688b532060e4135c29f4e24224a6c34c0f174dbd265e4bd27506d88175563' <<< "$CERT"
      - name: Publicar release e checksum imutaveis
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="dfl-admin-android-${GITHUB_RUN_NUMBER}"
          NAME="DFL-Admin-${GITHUB_RUN_NUMBER}.apk"
          test ! -z "${GITHUB_SHA}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo 'Release ja existe: nao sobrescrever'; exit 1; fi
          mv dist/app-release.apk "dist/$NAME"
          ( cd dist && sha256sum "$NAME" > "$NAME.sha256" )
          printf 'DFL Admin certificado. Build: %s\nCommit: %s\nPacote: br.com.dafamilialanches.admin\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > dist/NOTAS.txt
          gh release create "$TAG" "dist/$NAME" "dist/$NAME.sha256" --target "$GITHUB_SHA" --title "DFL Admin Android ${GITHUB_RUN_NUMBER}" --notes-file dist/NOTAS.txt --latest=false

  release-cliente-certified:
    name: Release Cliente (somente com aprovacao explicita)
    needs: [scope, cliente]
    if: ${{ needs.scope.outputs.cliente == 'true' && needs.cliente.result == 'success' && vars.DFL_ANDROID_RELEASES_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DFL-Cliente-${{ github.run_number }}-${{ github.sha }}
          path: dist
      - name: Revalidar APK, pacote e assinatura antes de Release
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/app-release.apk"
          test -s "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n1)"
          SIGNER="$(find "$SDK/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n1)"
          test -n "$AAPT" && test -n "$SIGNER"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -Fq "name='br.com.dafamilialanches.cliente'" <<< "$BADGING"
          grep -Fq "versionCode='${GITHUB_RUN_NUMBER}'" <<< "$BADGING"
          CERT="$("$SIGNER" verify --print-certs "$APK")"
          grep -iEq '77f688b532060e4135c29f4e24224a6c34c0f174dbd265e4bd27506d88175563' <<< "$CERT"
      - name: Publicar release e checksum imutaveis
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="dfl-cliente-android-${GITHUB_RUN_NUMBER}"
          NAME="DFL-Cliente-${GITHUB_RUN_NUMBER}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then echo 'Release ja existe: nao sobrescrever'; exit 1; fi
          mv dist/app-release.apk "dist/$NAME"
          ( cd dist && sha256sum "$NAME" > "$NAME.sha256" )
          printf 'DFL Cliente certificado. Build: %s\nCommit: %s\nPacote: br.com.dafamilialanches.cliente\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > dist/NOTAS.txt
          gh release create "$TAG" "dist/$NAME" "dist/$NAME.sha256" --target "$GITHUB_SHA" --title "DFL Cliente Android ${GITHUB_RUN_NUMBER}" --notes-file dist/NOTAS.txt --latest=false
