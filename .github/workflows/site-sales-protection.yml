name: DFL SITE - Protecao Critica de Vendas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dfl-site-sales-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sales-critical:
    name: Sales Critical / checkout + Firestore + regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias (lockfile)
        run: npm ci
      - name: Testar fluxo real da API com Firestore simulado
        run: node scripts/test-site-sales-critical-r1.cjs
      - name: Validar autoridade da loja no backend e corrida de fechamento
        run: node scripts/test-site-sales-operation-r2.cjs
      - name: Validar confirmacao de pedido e falhas pos-registro
        run: node scripts/test-site-sales-recovery-r3.cjs
      - name: Verificar resolvedor read-only R4 de pedidos incertos
        run: node scripts/test-site-sales-r4-resolver.cjs
      - name: R5 Recuperacao visivel de pedido incerto
        run: node scripts/test-site-sales-r5-ui-recovery.cjs
      - name: R6 - Integridade da protecao de vendas
        run: node scripts/test-site-sales-r6-guard.cjs
      - name: R102 pre-abertura, Assist e invariantes de pedidos
        run: node scripts/test-site-r102-preopening.cjs
      - name: R103 - Identidade visual isolada de checkout e precos
        run: node scripts/test-visual-campaign-r103.cjs
      - name: R104 - Campanhas seguras e vitrine acessível
        run: node scripts/test-visual-campaign-r104.cjs
      - name: R105 - Fechamento e confiabilidade de campanhas
        run: node scripts/test-site-r105-closing.cjs
      - name: R106 - Produto em campanha e desempenho PWA
        run: node scripts/test-site-r106-pwa-polish.cjs
      - name: R107 - Locks de rolagem sem sobreposicao
        run: node scripts/test-site-r107-scroll-lock.cjs
      - name: R228 - Transporte e mensagens independentes
        run: node scripts/test-site-r228-relay-separation.cjs
      - name: R228 - Checkout incerto protegido
        run: node scripts/test-site-r228-checkout-compat.cjs
      - name: R233 — Bairro parcial, Jardim Quebec e frete seguro
        run: node scripts/test-site-r233-quebec.cjs
      - name: R233-R2 — Nome de rua incompleto e integridade do pedido
        run: node scripts/test-site-r233-street-guard.cjs
      - name: R233-R3 — Teste transacional com validador real de rua
        run: node scripts/test-site-r233-sales-mock.cjs
      - name: R236 - Certificacao operacional, feriado, combos, offline e mobile
        run: node scripts/test-site-r236-operational-final.cjs
      - name: R237 - Motor isolado de personalizacao por unidade, com API v1 protegida
        run: node scripts/test-site-r237-combo-unit-engine.cjs
      - name: R238 - Previa comercial isolada de personalizacao por lanche
        run: node scripts/test-site-r238-combo-commerce.cjs
      - name: R239 - Ponte isolada de carrinho e bloqueio v1 para combos por lanche
        run: node scripts/test-site-r239-combo-cart-bridge.cjs
      - name: R240 - Contrato isolado de cozinha, bobina e Entregas para combo por unidade
        run: node scripts/test-site-r240-kitchen-handoff.cjs
      - name: R241 - Auditoria de compatibilidade versionada Site e Entregas (OFF)
        run: node scripts/test-site-r241-receiver-compat.cjs
      - name: R243 - Interface OFF e estados individuais de combos (somente simulacao)
        run: node scripts/test-site-r243-combo-editor.cjs
      - name: R244 - Catalago real e planos independentes por combo (laboratorio OFF)
        run: node scripts/test-site-r244-catalog-batch.cjs
      - name: R245 - Contrato cruzado de combos independentes Site e Entregas (laboratorio OFF)
        run: node scripts/test-site-r245-combo-joint.cjs
      - name: R246 - Remocoes autorizadas no Admin e bobina 58/80 em laboratorio
        run: node scripts/test-site-r246-removals-thermal.cjs
      - name: R247 - laboratorio premium visivel apenas no Admin (sem compra, print ou relay)
        run: node scripts/test-site-r247-premium-admin-lab.cjs
      - name: R248 - Preco no servidor administrativo e contrato de combo (sem pagamento)
        run: node scripts/test-site-r248-server-quote.cjs
      - name: R249 - Certificacao V3 de combos sem habilitar vendas
        run: node scripts/test-site-r249-v3-gate.cjs
      - name: Gates completos de regressao e TypeScript (sem build)
        run: node scripts/test-site-v88-v90-release-gate.cjs
