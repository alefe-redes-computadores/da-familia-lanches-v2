name: Build Evolution 2.3.7 Pairing Patch

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Evolution v2.3.7
        uses: actions/checkout@v4
        with:
          repository: evolution-foundation/evolution-api
          ref: cd800f2
          path: evolution

      - name: Checkout PR 2727 patch source
        uses: actions/checkout@v4
        with:
          repository: cloviscoli/evolution-api
          ref: dffeac4fe2bf67855deb4881a4a492588f2b70d7
          path: patched

      - name: Preparar Evolution 2.3.7 + patch
        shell: bash
        run: |
          set -euo pipefail

          cd evolution

          echo "=== BASE ==="
          echo "commit=$(git rev-parse HEAD)"
          echo "evolution=$(node -p 'require("./package.json").version')"

          test "$(node -p 'require("./package.json").version')" = "2.3.7"

          echo "=== TRAZENDO PATCH VALIDADO DO PR 2727 ==="
          mkdir -p patches
          cp ../patched/patches/baileys+7.0.0-rc14.patch \
             patches/baileys+7.0.0-rc14.patch

          echo "=== ALTERANDO SOMENTE BAILEYS ==="
          npm pkg set 'dependencies.baileys=7.0.0-rc14'

          # Gera lock coerente com a base 2.3.7 sem executar scripts ainda.
          npm install --package-lock-only --ignore-scripts

          echo "=== GARANTINDO PATCH-PACKAGE ==="
          node -e '
            const fs=require("fs");
            const p=require("./package.json");
            const old=p.scripts?.postinstall || "";
            if (!old.includes("patch-package")) {
              p.scripts = p.scripts || {};
              p.scripts.postinstall = old
                ? old + " && patch-package"
                : "patch-package";
            }
            if (!(p.dependencies?.["patch-package"] || p.devDependencies?.["patch-package"])) {
              p.devDependencies = p.devDependencies || {};
              p.devDependencies["patch-package"] = "^8.0.0";
            }
            fs.writeFileSync("package.json", JSON.stringify(p,null,2)+"\n");
          '

          npm install --package-lock-only --ignore-scripts

          echo "=== CONTRATO ANTES DO BUILD ==="
          test "$(node -p 'require("./package.json").version')" = "2.3.7"
          test "$(node -p 'require("./package.json").dependencies.baileys')" = "7.0.0-rc14"
          test -s patches/baileys+7.0.0-rc14.patch

          echo "evolution=2.3.7"
          echo "baileys=7.0.0-rc14"
          echo "patch=$(wc -l < patches/baileys+7.0.0-rc14.patch) linhas"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e publicar
        uses: docker/build-push-action@v6
        with:
          context: evolution
          push: true
          tags: ghcr.io/alefe-redes-computadores/dfl-evolution-pairing:2.3.7-pr2727-v2
          provenance: false
          sbom: false
